name: fetch-legacy-doom64-ce
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fetch-legacy-doom64-ce.yml
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download ModDB archive with browser headers
        run: |
          set -euxo pipefail
          curl -L --fail --retry 8 --retry-delay 4 --compressed \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153.0.0.0 Safari/537.36' \
            -e 'https://www.moddb.com/downloads/doom-64-ce-3101-full-download' \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            -o legacy.zip 'https://www.moddb.com/downloads/start/276168'
          file legacy.zip
          unzip -q legacy.zip 'DOOM64.CE.ipk3' 'patcher/DOOM64.bps' 'doom64-install.bat'
          mkdir -p kit
          cp DOOM64.CE.ipk3 kit/
          cp patcher/DOOM64.bps kit/
          cp doom64-install.bat kit/
          sha256sum kit/*
          ls -lh kit/
      - uses: actions/upload-artifact@v4
        with:
          name: doom64-ce-3.10.1-core
          path: kit
          retention-days: 1
          compression-level: 0
