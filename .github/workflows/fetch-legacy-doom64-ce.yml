name: fetch-legacy-doom64-ce
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fetch-legacy-doom64-ce.yml
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download ModDB archive
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o legacy.zip 'https://www.moddb.com/downloads/start/276166'
          unzip -q legacy.zip 'DOOM64.CE.ipk3' 'patcher/DOOM64.bps' 'doom64-install.bat'
          mkdir -p kit
          cp DOOM64.CE.ipk3 kit/
          cp patcher/DOOM64.bps kit/
          cp doom64-install.bat kit/
          sha256sum kit/*
          ls -lh kit/
      - uses: actions/upload-artifact@v4
        with:
          name: doom64-ce-3.10.1-core
          path: kit
          retention-days: 1
          compression-level: 0
