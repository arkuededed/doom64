name: extract-doom64-ce-installer
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          curl -L --fail --retry 5 --retry-delay 3 -o ce.zip https://github.com/arkuededed/doom64/releases/download/doomce/DOOM64.CE-4.0.0.zip
          unzip -p ce.zip doom64-install.bat > doom64-install.bat
          cat doom64-install.bat
      - uses: actions/upload-artifact@v4
        with:
          name: doom64-install-bat
          path: doom64-install.bat
          retention-days: 1